<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>World on Edge - Map</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    >
</head>

<body class="map-page">

    <div id="world-map">
    <div id="sea-background"></div>
</div>
    
    <!-- Foutmelding -->
    <div id="map-error">
        <strong>KAART LADEN...</strong>
        <span>Een moment...</span>
    </div>

    <!-- HUD -->
    <div class="map-hud">

        <div class="hud-title">
            WORLD ON EDGE
        </div>

        <div class="hud-country">
            <span>LAND</span>
            <strong id="map-country">Laden...</strong>
        </div>

        <div class="hud-stat">
            <span>⭐ Punten</span>
            <strong id="map-points">0</strong>
        </div>

        <div class="hud-stat">
            <span>👥 Mankracht</span>
            <strong id="map-manpower">0</strong>
        </div>

        <div class="hud-stat">
            <span>🏭 Fabrieken</span>
            <strong id="map-factories">0</strong>
        </div>

    </div>

    <div class="map-info">
        <strong id="map-status">WERELDKAART</strong>
        <span>Jouw gebied is groen</span>
    </div>
    
    <div class="map-mode-panel">
    <button id="land-mode" class="map-mode active">
        LAND
    </button>

    <button id="province-mode" class="map-mode">
        PROVINCIE
    </button>
</div>

<div id="province-message" class="province-message hidden">
    PROVINCIES KUNNEN NIET GELADEN WORDEN VOOR NU
</div>

    <script
        src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>

    <script src="map.js?v=16"></script>
    
    <script>
    const mapPlayer =
        JSON.parse(
            sessionStorage.getItem("worldOnEdgePlayer") || "{}"
        );

    async function updateMapPoints() {

        const pointsElement =
            document.getElementById("map-points");

        if (!pointsElement || !mapPlayer.username) {
            return;
        }

        try {

            const response =
                await fetch(
                    "https://bwbjnytzgntmqjefnpkh.supabase.co/functions/v1/leaderboard"
                );

            const result =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    result.error ||
                    "Punten konden niet worden geladen."
                );
            }

            const currentPlayer =
                result.players.find(
                    player =>
                        player.username ===
                        mapPlayer.username
                );

            if (currentPlayer) {

                const number =
                    Number(currentPlayer.points) || 0;

                if (number >= 1000000) {

                    pointsElement.textContent =
                        (number / 1000000)
                            .toFixed(
                                number % 1000000 === 0
                                    ? 0
                                    : 1
                            ) + "M";

                } else if (number >= 1000) {

                    pointsElement.textContent =
                        (number / 1000)
                            .toFixed(
                                number % 1000 === 0
                                    ? 0
                                    : 1
                            ) + "K";

                } else {

                    pointsElement.textContent =
                        number.toString();

                }

            }

        } catch (error) {

            console.error(
                "Kaartpunten laden mislukt:",
                error
            );

        }
    }

    updateMapPoints();

    setInterval(
        updateMapPoints,
        5000
    );
</script>
    
</body>
</html>
