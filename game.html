<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>World on Edge — Command Center</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #141a21 0%, #080b0f 70%);
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* TOP BAR */

        .top-bar {
            height: 72px;
            border-bottom: 1px solid #303944;
            background: rgba(8, 11, 15, 0.97);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;
        }

        .game-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .player-info {
            text-align: right;
        }

        #player-name {
            font-weight: bold;
            font-size: 14px;
        }

        #player-role {
            margin-top: 4px;
            color: #7f8b98;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* RESOURCES */

        .resources {
            position: absolute;
            top: 92px;
            left: 25px;

            width: 230px;

            background: rgba(13, 17, 22, 0.96);
            border: 1px solid #303944;

            padding: 18px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .resources-title {
            font-size: 11px;
            color: #7f8b98;
            letter-spacing: 2px;
            text-transform: uppercase;

            margin-bottom: 16px;
        }

        .resource {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 11px 0;
            border-bottom: 1px solid #222a33;
        }

        .resource:last-child {
            border-bottom: none;
        }

        .resource-name {
            color: #aeb8c4;
            font-size: 13px;
        }

        .resource-value {
            font-size: 15px;
            font-weight: bold;
        }

        /* CENTER */

        .center {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            width: 90%;
            max-width: 600px;
        }

        .status-title {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 3px;

            margin-bottom: 12px;
        }

        .status-text {
            color: #8994a0;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* BUTTONS */

        .game-button {
            margin-top: 28px;

            padding: 15px 32px;

            background: #d9dde1;
            color: #080b0f;

            border: none;

            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;

            cursor: pointer;
        }

        .game-button:hover {
            background: #ffffff;
        }

        .game-button:disabled {
            opacity: 0.65;
            cursor: default;
        }

        #server-button {
            display: none;
        }

        #join-server-button {
            display: none;
        }

        /* COUNTRY SELECTION OVERLAY */

        #country-selection {
            display: none;

            position: fixed;
            inset: 0;

            z-index: 100;

            background:
                radial-gradient(
                    circle at center,
                    rgba(20, 26, 33, 0.98),
                    rgba(5, 8, 11, 0.99)
                );

            padding: 40px;
            overflow-y: auto;
        }

        .country-container {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;
        }

        .country-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .country-header h1 {
            font-size: 30px;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .country-header p {
            color: #7f8b98;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .country-region {
            margin-bottom: 30px;
        }

        .region-title {
            color: #7f8b98;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;

            border-bottom: 1px solid #303944;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .country-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(210px, 1fr));

            gap: 10px;
        }

        .country-option {
            background: rgba(13, 17, 22, 0.96);

            border: 1px solid #303944;

            padding: 17px;

            color: #ffffff;

            text-align: left;

            cursor: pointer;

            transition:
                background 0.15s,
                border-color 0.15s,
                transform 0.15s;
        }

        .country-option:hover {
            background: #1b222b;
            border-color: #7f8b98;
            transform: translateY(-2px);
        }

        .country-name {
            display: block;

            font-size: 13px;
            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 7px;
        }

        .country-capital {
            display: block;

            color: #7f8b98;

            font-size: 10px;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .special-country {
            border-color: #8c7650;
        }

        .special-country:hover {
            border-color: #d0b071;
        }

        .special-label {
            display: inline-block;

            margin-top: 9px;

            color: #d0b071;

            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .country-close {
            display: block;

            margin: 35px auto 0;

            padding: 12px 25px;

            background: transparent;

            color: #7f8b98;

            border: 1px solid #303944;

            cursor: pointer;

            letter-spacing: 1px;
        }

        .country-close:hover {
            color: #ffffff;
            border-color: #ffffff;
        }

        /* BOTTOM */

        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 42px;

            border-top: 1px solid #252d36;

            background: rgba(8, 11, 15, 0.97);

            display: flex;
            align-items: center;

            padding: 0 25px;

            color: #596572;
            font-size: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <header class="top-bar">

        <div class="game-title">
            WORLD ON EDGE
        </div>

        <div class="player-info">
            <div id="player-name">Loading...</div>
            <div id="player-role">Loading...</div>
        </div>

    </header>


    <!-- RESOURCES -->

    <div class="resources">

        <div class="resources-title">
            National Resources
        </div>

        <div class="resource">
            <span class="resource-name">Punten</span>
            <span class="resource-value" id="points">0</span>
        </div>

        <div class="resource">
            <span class="resource-name">Fabrieken</span>
            <span class="resource-value" id="factories">0</span>
        </div>

        <div class="resource">
            <span class="resource-name">Mankracht</span>
            <span class="resource-value" id="manpower">0</span>
        </div>

    </div>


    <!-- CENTER -->

    <main class="center">

        <div class="status-title" id="status-title">
            GEEN SERVER AANGEMAAKT
        </div>

        <div class="status-text" id="status-text">
            Wacht op KingJames43
        </div>

        <button
            id="server-button"
            class="game-button">
            SERVER AANMAKEN
        </button>

        <button
            id="join-server-button"
            class="game-button">
            JOIN SERVER
        </button>

    </main>


    <!-- COUNTRY SELECTION -->

    <section id="country-selection">

        <div class="country-container">

            <div class="country-header">

                <h1>KIES JE LAND</h1>

                <p>
                    Kies een rijk, unie, samenwerking of land

                </p>

                            Frankrijk
                        </span>

                            Hoofdstad: Parijs

                    <button class="country-option special-country"
                        data-country="Pools-Zwitserse Unie">
                        <span class="country-name">
                            Pools-Zwitserse Unie
                        </span>
                        <span class="country-capital">
                            Hoofdstad: Warschau
                        </span>
                        <span class="special-label">
                            Speciale bonus
                        </span>
                    </button>

                    <button class="country-option"
                        data-country="Duitsland">
                        <span class="country-name">
                            Duitsland
                        </span>
                        <span class="country-capital">
                            Hoofdstad: Berlijn
                        </span>
                    </button>

                    <button class="country-option"
                        data-country="Oostenrijk-Hongarije">

                        </span>

                            Hoofdstad: Wenen
                        </span>

                    <button class="country-option"

                        <span class="country-name">
                            Oekraïne
                        </span>
                        <span class="country-capital">
                            Hoofdstad: Kyiv
                        </span>
                    </button>

                    <button class="country-option"
                        data-country="Rusland">
                        <span class="country-name">
                            Rusland
                        </span>
                        <span class="country-capital">
                            Hoofdstad: Moskou
                        </span>
                    </button>

                    <button class="country-option"
                        data-country="Zweden">
                        <span class="country-name">
                            Zweden
                        </span>
                        <span class="country-capital">
                            Hoofdstad: Stockholm
                        </span>

                    <button class="country-option"
                        data-country="Groot-Brittannië">
                        <span class="country-name">
                            Groot-Brittannië
                        </span>
                        <span class="country-capital">
                            Met Ierland • Londen
                        </span>

                    <button class="country-option"

                        <span class="country-name">
                            Servië

                        <span class="country-capital">

                    <button class="country-option"

                    <button class="country-option"

                    <button class="country-option"

                    <button class="country-option"

                        <span class="country-name">

            </div>


            <!-- AZIË -->

                    <button class="country-option special-country"

                    <button class="country-option"

                    <button class="country-option special-country"

                        </span>
                        <span class="country-capital">

                            Speciale bonus
                        </span>
                    </button>

                    <button class="country-option"
                        data-country="Oostelijk Midden-Oosten">
                        <span class="country-name">
                            Oostelijk Midden-Oosten
                        </span>

                    <button class="country-option"

            <!-- AFRIKA -->

            <!-- NOORD-AMERIKA -->

                </div>

                <div class="country-grid">

                        data-country="Amerika">

                        </span>

                        </span>
                    </button>

                    <button class="country-option"
                        data-country="Canada">

                        </span>

                            Ottawa
                        </span>
                    </button>

                    <button class="country-option"
                        data-country="Mexico">

            <button

                class="country-close">
                TERUG

    </section>


    <!-- BOTTOM -->

    <div class="bottom-bar">
        WORLD ON EDGE • COMMAND CENTER
    </div>


    <script src="game.js"></script>

</body>
</html>
